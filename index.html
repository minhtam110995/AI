<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFCF3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Minh An">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F2A5C'/%3E%3Cpath fill='%23F5B301' d='M32 10l6.5 13.5 14.8 1.9-10.9 10.2 2.8 14.7L32 43l-13.2 7.3 2.8-14.7-10.9-10.2 14.8-1.9z'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}</style>
</head><body>
<title>Minh An Học Vui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<title>Minh An Học Vui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
:root{
  --paper:#FFFCF3; --grid:#E4ECF7; --ink:#1F2A5C; --muted:#5D6893; --line:#DCE2F0; --card:#FFFFFF;
  --star:#F5B301; --star-d:#B98200; --star-s:#FFF4CC;
  --good:#23965A; --good-s:#E3F5EA; --bad:#D8433A; --bad-s:#FCE7E4;
  --math:#2F6FDB; --math-s:#E6EEFC; --tv:#8A4FD8; --tv-s:#F0E8FC;
  --en:#0F9A8F; --en-s:#E0F4F2; --dd:#E0701A; --dd-s:#FDEEDF;
  --r:18px; --lift:0 4px 0 rgba(31,42,92,.14);
  --display:'Baloo 2','Nunito',system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:30px 30px;
  color:var(--ink); font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif; font-size:18px; line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--math);outline-offset:3px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:12px 48px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(255,252,243,.94);backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
.bar .in{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:22px;margin-right:auto;min-width:0}
.brand .seal{width:40px;height:40px;border-radius:12px;background:var(--ink);color:var(--star);display:grid;place-items:center;font-size:22px;flex:none}
.brand small{display:block;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;color:var(--muted);line-height:1}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px;font-family:var(--display);font-weight:800;font-size:20px;background:var(--star-s);border:2px solid var(--star);color:var(--ink);font-variant-numeric:tabular-nums}
.pill .st{color:var(--star)}
.icon-btn{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:14px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:16px;box-shadow:var(--lift)}
.icon-btn:active{transform:translateY(3px);box-shadow:none}
.icon-btn svg{width:22px;height:22px}
@media (max-width:560px){.icon-btn .lb{display:none}.brand small{display:none}}

/* ---------- generic ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:18px}
.muted{color:var(--muted)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 22px;border-radius:16px;font-family:var(--display);font-weight:800;font-size:20px;background:var(--ink);color:#fff;box-shadow:0 5px 0 #0E1640}
.btn:active{transform:translateY(4px);box-shadow:none}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:var(--lift)}
.btn.gold{background:var(--star);color:var(--ink);box-shadow:0 5px 0 var(--star-d)}
.btn.good{background:var(--good);box-shadow:0 5px 0 #146B3E}
.btn.bad{background:var(--bad);box-shadow:0 5px 0 #8F2620}
.btn[disabled]{opacity:.45;pointer-events:none}
.back{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--muted);padding:8px 0;font-size:17px}
.say{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--star-s);border:2px solid var(--star);flex:none;vertical-align:middle}
.say svg{width:22px;height:22px;fill:var(--ink)}
.say.sm{width:34px;height:34px}.say.sm svg{width:17px;height:17px}
.bar-prog{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar-prog i{display:block;height:100%;background:var(--star);border-radius:99px}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 10px;font-size:14px;font-weight:800;background:var(--line);color:var(--ink)}
.chip.ok{background:var(--good-s);color:var(--good)}
.chip.try{background:var(--star-s);color:var(--star-d)}
.chip.no{background:var(--bad-s);color:var(--bad)}
.eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.save-note{font-size:13px;color:var(--muted);text-align:center;margin-top:28px}

/* ---------- home ---------- */
.hello{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin:8px 0 18px}
.hello h1{font-size:clamp(30px,5vw,44px)}
.hello p{margin:4px 0 0;color:var(--muted);font-weight:700}
.goal{display:grid;gap:10px;background:var(--card);border:2px solid var(--star);border-radius:var(--r);padding:16px 18px;margin-bottom:22px;box-shadow:0 4px 0 var(--star-d)}
.goal .t{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:800}
.goal .big{font-size:40px;line-height:1}
.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:520px){.subjects{grid-template-columns:1fr}}
.subj{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:16px;box-shadow:0 5px 0 var(--c)}
.subj:active{transform:translateY(4px);box-shadow:none}
.glyph{width:76px;height:76px;border-radius:20px;display:grid;place-items:center;background:var(--c);color:#fff;font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em}
.subj h2{font-size:28px;color:var(--c)}
.subj .meta{font-size:15px;font-weight:700;color:var(--muted);margin:2px 0 8px}
.subj .bar-prog i{background:var(--c)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:28px 0 12px}
.sec-title h2{font-size:24px}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--card);border:2px dashed var(--c,var(--line));border-radius:16px;padding:12px 14px;text-align:left;width:100%}
.task + .task{margin-top:10px}
.task .dot{width:14px;height:14px;border-radius:50%;background:var(--c)}
.task b{display:block}
.task span{font-size:15px;color:var(--muted)}

/* ---------- subject ---------- */
.subj-head{display:flex;gap:16px;align-items:center;margin:6px 0 10px}
.subj-head h1{font-size:36px;color:var(--c)}
.topic{margin-top:22px}
.topic h3{font-size:20px;margin-bottom:10px;display:flex;gap:10px;align-items:baseline}
.topic h3 .n{font-family:var(--display);color:var(--c);font-size:16px}
.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.les{display:grid;gap:8px;align-content:start;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--lift);min-height:96px}
.les:active{transform:translateY(3px);box-shadow:none}
.les b{font-size:17px;line-height:1.25}
.les.done{border-color:var(--good);background:linear-gradient(0deg,var(--good-s),var(--card) 60%)}
.les .row{gap:6px}

/* ---------- lesson ---------- */
.les-head{display:grid;gap:4px;margin:4px 0 14px}
.les-head h1{font-size:clamp(26px,4vw,34px)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:6px;margin-bottom:18px}
.tabs button{min-height:52px;border-radius:13px;font-family:var(--display);font-weight:800;font-size:18px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.tabs button .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:var(--line);color:var(--ink)}
.tabs button.on{background:var(--c);color:#fff}
.tabs button.on .n{background:#fff;color:var(--c)}
@media (max-width:480px){.tabs button{font-size:16px}.tabs button .n{display:none}}
.learn{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.lcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px;align-content:start}
.lcard .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.lcard .unit{font-family:var(--display);font-weight:800;font-size:56px;line-height:1;color:var(--c)}
.lcard p{margin:0;font-size:19px;font-weight:700}
.exw{display:flex;gap:10px;flex-wrap:wrap}
.exw button{display:grid;justify-items:center;gap:2px;min-width:74px;padding:8px 10px;border-radius:14px;background:var(--paper);border:2px solid var(--line);font-weight:800}
.exw button .e{font-size:34px;line-height:1.1}
.cta{display:flex;justify-content:center;margin-top:22px}
.rule{display:grid;gap:12px;max-width:560px;margin:0 auto;text-align:center}
.rule .big{font-family:var(--display);font-size:64px;line-height:1}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}
.rules div{border-radius:14px;padding:12px;font-weight:800}
.rules .g{background:var(--good-s);color:var(--good)}
.rules .b{background:var(--bad-s);color:var(--bad)}
.real{display:grid;gap:14px;max-width:640px;margin:0 auto}
.real .ticket{position:relative;background:var(--card);border:3px dashed var(--c);border-radius:22px;padding:22px}
.real .ticket p{font-size:22px;font-weight:800;margin:8px 0 0;line-height:1.35}

/* ---------- quiz ---------- */
.quiz{max-width:760px;margin:0 auto;display:grid;gap:16px}
.qtop{display:flex;align-items:center;gap:12px}
.dots{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.dots i{width:22px;height:10px;border-radius:99px;background:var(--line)}
.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--c)}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;display:grid;gap:16px}
.prompt{display:flex;gap:12px;align-items:flex-start;font-size:22px;font-weight:800;line-height:1.3}
.prompt .tx{flex:1}
.visual{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;overflow-x:auto}
.listen{display:grid;place-items:center;width:110px;height:110px;border-radius:50%;background:var(--c);box-shadow:0 6px 0 rgba(0,0,0,.18)}
.listen svg{width:52px;height:52px;fill:#fff}
.listen:active{transform:translateY(4px);box-shadow:none}
.opts{display:grid;gap:12px;grid-template-columns:repeat(var(--cols,2),minmax(0,1fr))}
@media (max-width:520px){.opts{grid-template-columns:repeat(min(var(--cols,2),2),minmax(0,1fr))}.opts.c1{grid-template-columns:1fr}}
.opt{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:72px;padding:10px 12px;border-radius:18px;background:var(--paper);border:3px solid var(--line);font-weight:800;font-size:20px;text-align:center;box-shadow:var(--lift)}
.opt:active{transform:translateY(3px);box-shadow:none}
.opt.col{flex-direction:column;gap:2px}
.opt .pic{font-size:52px;line-height:1.05}
.opt .pic .svgpic svg{width:60px;height:60px}
.opt .lb{font-size:17px}
.opt.big .t{font-family:var(--display);font-size:42px;line-height:1}
.opt .sub{display:block;font-size:13px;color:var(--muted)}
.opt.left{justify-content:flex-start;text-align:left}
.opt .osay{position:absolute;top:6px;right:6px}
.opt.left{padding-right:52px}
.opt.ok{border-color:var(--good);background:var(--good-s)}
.opt.no{border-color:var(--bad);background:var(--bad-s)}
.opts.lock .opt{pointer-events:none}
.opts.lock .opt:not(.ok):not(.no){opacity:.5}
.fb{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-radius:18px;padding:14px 16px;font-weight:800;font-size:20px}
.fb.ok{background:var(--good-s);color:var(--good)}
.fb.no{background:var(--bad-s);color:var(--bad)}
.order-slot{min-height:70px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px;border:3px dashed var(--line);border-radius:16px;background:var(--paper)}
.order-slot:empty::before{content:'Chạm vào các thẻ bên dưới theo đúng thứ tự';color:var(--muted);font-weight:700;font-size:16px}
.order-bank{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tile{min-height:54px;padding:8px 16px;border-radius:14px;background:var(--card);border:2px solid var(--c);font-weight:800;font-size:20px;box-shadow:0 4px 0 var(--c)}
.tile:active{transform:translateY(3px);box-shadow:none}
.tile.used{visibility:hidden}
.order-slot .tile{box-shadow:none}
.order-slot.ok{border-color:var(--good);background:var(--good-s)}
.order-slot.no{border-color:var(--bad);background:var(--bad-s)}
.answer-line{font-weight:800;color:var(--good)}

/* visuals */
.grp{display:grid;grid-template-columns:repeat(5,auto);gap:4px 8px;font-size:40px;line-height:1.1;justify-content:center}
.grp.sm{font-size:34px;gap:2px 6px}
.grp span.gone{opacity:.35;position:relative}
.grp span.gone::after{content:'';position:absolute;left:-2px;right:-2px;top:50%;height:4px;background:var(--bad);transform:rotate(-30deg);border-radius:4px}
.grp.empty{min-width:120px;min-height:70px;border:3px dashed var(--line);border-radius:14px;display:grid;place-items:center}
.grp .none{font-size:16px;color:var(--muted);font-weight:700}
.op{font-family:var(--display);font-size:48px;font-weight:800;color:var(--c)}
.eq{font-family:var(--display);font-weight:800;font-size:clamp(44px,8vw,64px);letter-spacing:.02em;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center}
.slot{display:inline-grid;place-items:center;min-width:1.3em;height:1.3em;border:4px dashed var(--c);border-radius:14px;color:var(--c)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.pair > div{border:2px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:6px;justify-items:center;align-content:start}
.pair b{font-size:16px;color:var(--muted)}
.seq{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.seq span{min-width:62px;height:62px;display:grid;place-items:center;border-radius:14px;background:var(--math-s);font-family:var(--display);font-weight:800;font-size:30px}
.seq span.slot{background:var(--card)}
.pic-lg{font-size:84px;line-height:1}
.pic-lg .svgpic svg{width:96px;height:96px}
.word{font-family:var(--display);font-weight:800;font-size:clamp(40px,7vw,56px);letter-spacing:.03em}
.stack{display:grid;gap:4px;justify-items:center;font-size:52px;line-height:1.1}
.lineup{display:flex;gap:14px;align-items:flex-end;font-size:54px;justify-content:center}
.lineup .flag{font-size:44px}
.lineup small{display:block;font-size:14px;font-weight:800;color:var(--muted);text-align:center}
.cal{width:150px;border-radius:14px;overflow:hidden;border:3px solid var(--ink);background:#fff;text-align:center;font-weight:800}
.cal small{display:block;background:var(--bad);color:#fff;padding:4px;font-size:16px}
.cal b{display:block;font-family:var(--display);font-size:64px;line-height:1.1}
.cal span{display:block;padding-bottom:8px;font-size:18px}
.sw{display:inline-block;width:26px;height:26px;border-radius:8px;vertical-align:middle}
.passage{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:20px;font-weight:700;line-height:1.55;text-align:left;width:100%}
.passage h4{margin:0 0 6px;font-family:var(--display);font-size:22px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.fill{font-size:24px;font-weight:800;text-align:center}
.fill u{text-decoration:none;display:inline-block;min-width:80px;border-bottom:4px solid var(--c)}
.svgpic{display:inline-grid;place-items:center}
.enpat{font-family:var(--display);font-size:26px;font-weight:800}

/* ---------- result ---------- */
.result{max-width:560px;margin:10px auto;text-align:center;display:grid;gap:16px;justify-items:center}
.ring{--p:0;width:190px;height:190px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--rc) calc(var(--p)*1%),var(--line) 0)}
.ring > div{width:150px;height:150px;border-radius:50%;background:var(--card);display:grid;place-items:center;align-content:center}
.ring b{font-family:var(--display);font-size:52px;line-height:1}
.ring span{font-weight:800;color:var(--muted);font-size:15px}
.delta{font-family:var(--display);font-weight:800;font-size:40px}
.delta.plus{color:var(--star-d)}.delta.minus{color:var(--bad)}.delta.zero{color:var(--muted);font-size:24px}

/* ---------- rewards ---------- */
.tier{margin-top:22px}
.tier-h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.tier-h .badge{font-family:var(--display);font-weight:800;padding:4px 14px;border-radius:12px;color:#fff;background:var(--tc)}
.tier-h .cost{font-family:var(--display);font-weight:800;font-size:20px}
.rewards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.rw{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 14px}
.rw .e{font-size:44px;grid-row:span 2}
.rw b{font-size:18px;line-height:1.25}
.rw .btn{grid-column:1/-1;min-height:46px;font-size:18px}
.rw .need{grid-column:1/-1;font-size:15px;font-weight:800;color:var(--muted);text-align:center;padding:10px;border-radius:14px;background:var(--paper)}
.voucher{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--star-s);border:2px solid var(--star);border-radius:18px;padding:12px 16px;position:relative}
.voucher + .voucher{margin-top:10px}
.voucher .e{font-size:40px}
.voucher.done{background:var(--card);border-color:var(--line);opacity:.75}

/* ---------- parent ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.stat{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px}
.stat b{display:block;font-family:var(--display);font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:15px;font-weight:700;color:var(--muted)}
.plist{display:grid;gap:10px}
.pitem{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px}
.pitem .row{gap:8px}
.pitem .btn{min-height:44px;font-size:16px;padding:0 14px}
.hist{width:100%;border-collapse:collapse;font-size:16px;background:var(--card);border-radius:14px;overflow:hidden}
.hist td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.hist td.n{font-family:var(--display);font-weight:800;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.hist td.n.p{color:var(--good)}.hist td.n.m{color:var(--bad)}
.hist td.d{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.tbl-wrap{overflow-x:auto;border:2px solid var(--line);border-radius:14px}
.form{display:grid;gap:10px;grid-template-columns:90px 1fr 150px auto;align-items:end}
@media (max-width:620px){.form{grid-template-columns:1fr 1fr}}
.form label{display:grid;gap:4px;font-size:14px;font-weight:800;color:var(--muted)}
.form input,.form select{min-height:46px;border-radius:12px;border:2px solid var(--line);padding:0 12px;font:inherit;font-size:17px;background:#fff;color:var(--ink);width:100%}
.toggle{display:flex;align-items:center;gap:12px;font-weight:800}
.toggle input{width:26px;height:26px;accent-color:var(--good)}
.danger{border:2px solid var(--bad-s);background:var(--card);border-radius:16px;padding:14px;display:grid;gap:10px}

/* ---------- modal & pin ---------- */
#modal{position:fixed;inset:0;z-index:50;background:rgba(20,26,60,.45);display:grid;place-items:center;padding:16px}
.sheet{width:min(440px,100%);background:var(--paper);border-radius:26px;padding:22px;display:grid;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:92vh;overflow:auto}
.sheet h2{font-size:26px;text-align:center}
.sheet p{margin:0;text-align:center;font-weight:700}
.pindots{display:flex;justify-content:center;gap:14px}
.pindots i{width:20px;height:20px;border-radius:50%;border:3px solid var(--ink)}
.pindots i.f{background:var(--ink)}
.pindots.err i{border-color:var(--bad);animation:shake .3s}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keypad button{min-height:62px;border-radius:16px;background:var(--card);border:2px solid var(--line);font-family:var(--display);font-weight:800;font-size:28px;box-shadow:var(--lift)}
.keypad button:active{transform:translateY(3px);box-shadow:none}
.hint{font-size:14px;color:var(--muted);text-align:center}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:12px 18px;font-weight:800;z-index:60;max-width:calc(100% - 32px);text-align:center;transition:opacity .25s}
#toast[hidden]{display:none!important}
.burst{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.burst span{position:absolute;top:-40px;font-size:30px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.7}}
@media (prefers-reduced-motion:reduce){.burst{display:none}.pindots.err i{animation:none}*{transition:none!important}}

<script>
/* ===================== core helpers ===================== */
const rint=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const sample=(a,n)=>shuffle(a).slice(0,n);
const range=(a,b)=>{const r=[];for(let i=a;i<=b;i++)r.push(i);return r;};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const okey=o=>typeof o==='object'?String(o.k??o.t??o.pic??o.html):String(o);
/* choice question: correct + distractors, deduped and shuffled */
function Q(prompt,correct,distractors,extra={}){
  const n=extra.n||4,seen=new Set([okey(correct)]),ds=[];
  for(const d of distractors){if(ds.length>=n-1)break;const k=okey(d);if(seen.has(k))continue;seen.add(k);ds.push(d);}
  const options=shuffle([correct,...ds]);
  return Object.assign({type:'choice',prompt,options,answer:options.indexOf(correct)},extra);
}
function numOpts(c,lo,hi,n=6){
  const s=new Set(),deltas=[1,-1,2,-2,3,-3,10,-10];let g=0;
  while(s.size<n&&g++<80){const d=c+pick(deltas);if(d>=lo&&d<=hi&&d!==c)s.add(d);}
  for(let x=lo;s.size<n&&x<=hi;x++)if(x!==c)s.add(x);
  return shuffle([...s]);
}
/* build n questions from a list of generators, avoiding repeats */
function mix(fns,n=10){
  const out=[],seen=new Set();let bag=[],tries=0;
  while(out.length<n&&tries<n*10){
    tries++;if(!bag.length)bag=shuffle(fns);
    const q=bag.pop()();if(!q)continue;
    const k=q.prompt+'|'+(q.visual||'')+'|'+(q.audio?q.audio.text:'')+'|'+(q.items||[]).join('/');
    if(seen.has(k))continue;seen.add(k);out.push(q);
  }
  return out;
}
/* read math prompts aloud in Vietnamese */
function spoken(t){return String(t).replace(/=\s*\?/g,'= mấy').replace(/☐/g,' mấy ').replace(/\+/g,' cộng ').replace(/−|-(?=\s*\d)/g,' trừ ').replace(/=/g,' bằng ').replace(/>/g,' lớn hơn ').replace(/</g,' bé hơn ').replace(/\s+/g,' ').trim();}

const DG=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
function readVN(n){
  if(n<10)return DG[n];if(n===100)return 'một trăm';
  const t=Math.floor(n/10),u=n%10;const s=t===1?'mười':DG[t]+' mươi';if(!u)return s;
  let w=DG[u];if(u===5)w='lăm';else if(u===1&&t>1)w='mốt';else if(u===4&&t>1)w='tư';
  return s+' '+w;
}

/* custom drawn pictures where no emoji fits */
const ICONS={
  desk:`<svg viewBox="0 0 64 64"><rect x="5" y="16" width="54" height="8" rx="2" fill="#B5773A"/><rect x="9" y="24" width="6" height="32" fill="#8C5A2B"/><rect x="49" y="24" width="6" height="32" fill="#8C5A2B"/><rect x="27" y="24" width="22" height="15" fill="#C98A4B"/><circle cx="38" cy="31" r="2.2" fill="#5B3A1A"/></svg>`,
  gate:`<svg viewBox="0 0 64 64"><path d="M6 58V26Q32 6 58 26V58" fill="none" stroke="#2F6B3A" stroke-width="5"/><g stroke="#2F6B3A" stroke-width="4"><line x1="16" y1="22" x2="16" y2="58"/><line x1="26" y1="17" x2="26" y2="58"/><line x1="38" y1="17" x2="38" y2="58"/><line x1="48" y1="22" x2="48" y2="58"/><line x1="6" y1="42" x2="58" y2="42"/></g></svg>`,
  top:`<svg viewBox="0 0 64 64"><rect x="29" y="3" width="6" height="13" rx="2" fill="#8A4FD8"/><path d="M7 22Q32 10 57 22L35 58Q32 63 29 58Z" fill="#E0493B"/><path d="M11 28H53" stroke="#F5B301" stroke-width="5"/><path d="M19 40H45" stroke="#2F6FDB" stroke-width="5"/></svg>`
};
function picHTML(p){return String(p).startsWith('svg:')?`<span class="svgpic">${ICONS[p.slice(4)]}</span>`:p;}
const SPEAKER='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>';

/* registry */
const L={};           // lessonId -> lesson
const SUBJ=[
  {id:'math',name:'Toán',glyph:'1+2',c:'var(--math)',s:'var(--math-s)',book:'Toán 1 · Kết nối tri thức',topics:[]},
  {id:'tv',name:'Tiếng Việt',glyph:'Aă',c:'var(--tv)',s:'var(--tv-s)',book:'Tiếng Việt 1 · Kết nối tri thức',topics:[]},
  {id:'en',name:'Tiếng Anh',glyph:'ABC',c:'var(--en)',s:'var(--en-s)',book:'Tiếng Anh 1 · Global Success',topics:[]},

];
const SUBJ_BY=Object.fromEntries(SUBJ.map(s=>[s.id,s]));
function topic(subj,name){const t={name,lessons:[]};SUBJ_BY[subj].topics.push(t);return t;}
function addLesson(t,subj,o){o.subj=subj;o.topic=t.name;L[o.id]=o;t.lessons.push(o.id);return o;}
/* ===================== TOÁN 1 (Kết nối tri thức) ===================== */
const OBJ=[['🍎','quả táo'],['🐟','con cá'],['⭐','ngôi sao'],['🌸','bông hoa'],['🐥','chú gà con'],['🍊','quả cam'],['🎈','quả bóng bay'],['🚗','chiếc ô tô'],['🐞','con bọ rùa'],['🍓','quả dâu tây'],['🦋','con bướm'],['🐢','con rùa']];
const COLORS=['#2F6FDB','#E0493B','#0F9A8F','#E0701A','#8A4FD8','#F5B301'];
function grp(e,n,cls=''){if(!n)return `<div class="grp empty ${cls}"><span class="none">không có</span></div>`;let s='';for(let i=0;i<n;i++)s+=`<span>${e}</span>`;return `<div class="grp ${cls}">${s}</div>`;}
function grpX(e,n,x){let s='';for(let i=0;i<n;i++)s+=`<span class="${i>=n-x?'gone':''}">${e}</span>`;return `<div class="grp">${s}</div>`;}
const eqv=s=>`<div class="eq">${s}</div>`;

const SH={
  'hình tròn':c=>`<circle cx="50" cy="50" r="40" fill="${c}"/>`,
  'hình vuông':c=>`<rect x="12" y="12" width="76" height="76" rx="3" fill="${c}"/>`,
  'hình tam giác':c=>`<polygon points="50,8 93,88 7,88" fill="${c}"/>`,
  'hình chữ nhật':c=>`<rect x="4" y="26" width="92" height="50" rx="3" fill="${c}"/>`
};
const shapeSvg=(name,c,size=120)=>`<svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="${name}">${SH[name](c)}</svg>`;
const SHOBJ={
  'hình tròn':[['🍪','bánh quy'],['⚽','quả bóng'],['🕐','mặt đồng hồ'],['🍩','bánh vòng'],['🥏','đĩa ném']],
  'hình tam giác':[['🍕','miếng bánh pizza'],['⛺','cái lều'],['🔺','hình biển báo'],['🍙','nắm cơm']],
  'hình chữ nhật':[['📱','điện thoại'],['🚪','cánh cửa'],['📺','ti vi'],['✉️','phong bì'],['📘','quyển sách']],
  'hình vuông':[['🎲','mặt xúc xắc'],['🧇','bánh kẹp'],['🟨','ô gạch vuông']]
};
function box3d(w,h,d,c){
  const x=10,y=10+d*.55,dx=d,dy=d*.55,W=x+w+dx+10,H=y+h+10;
  const k='stroke="#1F2A5C" stroke-width="2.5" stroke-linejoin="round"';
  return `<svg viewBox="0 0 ${W} ${H}" width="${Math.round(W*1.1)}" style="max-width:100%">
  <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}" ${k}/>
  <polygon points="${x},${y} ${x+dx},${y-dy} ${x+w+dx},${y-dy} ${x+w},${y}" fill="${c}" ${k}/>
  <polygon points="${x},${y} ${x+dx},${y-dy} ${x+w+dx},${y-dy} ${x+w},${y}" fill="#fff" opacity=".45"/>
  <polygon points="${x+w},${y} ${x+w+dx},${y-dy} ${x+w+dx},${y-dy+h} ${x+w},${y+h}" fill="${c}" ${k}/>
  <polygon points="${x+w},${y} ${x+w+dx},${y-dy} ${x+w+dx},${y-dy+h} ${x+w},${y+h}" fill="#000" opacity=".18"/></svg>`;
}
function tensSvg(n){
  const t=Math.floor(n/10),u=n%10,cell=13;let s='',x=4;
  for(let i=0;i<t;i++){for(let j=0;j<10;j++)s+=`<rect x="${x}" y="${4+j*cell}" width="${cell-2}" height="${cell-2}" rx="2" fill="#2F6FDB"/>`;x+=cell+5;}
  x+=10;for(let j=0;j<u;j++)s+=`<rect x="${x}" y="${4+(9-j)*cell}" width="${cell-2}" height="${cell-2}" rx="2" fill="#E0701A"/>`;
  const W=x+cell+4,H=8+10*cell;
  return `<svg viewBox="0 0 ${W} ${H}" width="${Math.round(W*1.5)}" style="max-width:100%">${s}</svg>`;
}
function clockSvg(h,size=160){
  let s=`<circle cx="60" cy="60" r="55" fill="#fff" stroke="#1F2A5C" stroke-width="4"/>`;
  for(let i=1;i<=12;i++){const a=i*Math.PI/6;s+=`<text x="${(60+43*Math.sin(a)).toFixed(1)}" y="${(60-43*Math.cos(a)+5).toFixed(1)}" text-anchor="middle" font-size="14" font-weight="800" font-family="Nunito,sans-serif" fill="#1F2A5C">${i}</text>`;}
  const ah=(h%12)*Math.PI/6;
  s+=`<line x1="60" y1="60" x2="${(60+27*Math.sin(ah)).toFixed(1)}" y2="${(60-27*Math.cos(ah)).toFixed(1)}" stroke="#D8433A" stroke-width="7" stroke-linecap="round"/><line x1="60" y1="60" x2="60" y2="17" stroke="#2F6FDB" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="60" r="5" fill="#1F2A5C"/>`;
  return `<svg viewBox="0 0 120 120" width="${size}" height="${size}" role="img" aria-label="đồng hồ chỉ ${h} giờ">${s}</svg>`;
}
function rulerSvg(n){
  const u=26,x0=12;let s=`<rect x="${x0}" y="8" width="${n*u}" height="22" rx="5" fill="#E0701A"/><polygon points="${x0+n*u},8 ${x0+n*u+14},19 ${x0+n*u},30" fill="#F5B301"/>`;
  s+=`<rect x="4" y="40" width="${12*u+18}" height="52" rx="7" fill="#FFF4CC" stroke="#B98200" stroke-width="2"/>`;
  for(let i=0;i<=12;i++){const x=x0+i*u;s+=`<line x1="${x}" y1="40" x2="${x}" y2="58" stroke="#1F2A5C" stroke-width="2"/><text x="${x}" y="80" text-anchor="middle" font-size="14" font-weight="800" font-family="Nunito,sans-serif" fill="#1F2A5C">${i}</text>`;if(i<12)s+=`<line x1="${x+u/2}" y1="40" x2="${x+u/2}" y2="49" stroke="#1F2A5C" stroke-width="1.5"/>`;}
  const W=12*u+26;
  return `<svg viewBox="0 0 ${W} 96" width="${W*1.3}" style="max-width:100%">${s}</svg>`;
}
const PCOL=[['Đỏ','#E0493B'],['Xanh','#2F6FDB'],['Vàng','#F5B301'],['Tím','#8A4FD8']];
function pencils(lens){
  let s='';lens.forEach((L,i)=>{const y=10+i*38,w=L*26,c=PCOL[i][1];s+=`<rect x="10" y="${y}" width="${w}" height="24" rx="4" fill="${c}"/><polygon points="${10+w},${y} ${10+w+20},${y+12} ${10+w},${y+24}" fill="#F3D3A5"/><circle cx="${10+w+17}" cy="${y+12}" r="3" fill="#1F2A5C"/>`;});
  const W=10+Math.max(...lens)*26+34;return `<svg viewBox="0 0 ${W} ${lens.length*38+14}" width="${Math.round(W*1.2)}" style="max-width:100%">${s}</svg>`;
}
function towers(hs){
  let s='';const mh=Math.max(...hs);hs.forEach((h,i)=>{const x=10+i*70,H=h*22,y=10+(mh-h)*22,c=PCOL[i][1];s+=`<rect x="${x}" y="${y}" width="50" height="${H}" rx="6" fill="${c}"/>`;for(let j=1;j<h;j++)s+=`<line x1="${x}" y1="${y+j*22}" x2="${x+50}" y2="${y+j*22}" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>`;});
  return `<svg viewBox="0 0 ${hs.length*70+10} ${mh*22+20}" width="${(hs.length*70+10)*1.2}" style="max-width:100%">${s}</svg>`;
}
const colorOpt=i=>({html:`<i class="sw" style="background:${PCOL[i][1]}"></i>`,t:PCOL[i][0],k:PCOL[i][0]});

const DAYS=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];
const ANI=[['🐱','mèo'],['🐶','chó'],['🐰','thỏ'],['🐻','gấu'],['🐷','lợn'],['🐸','ếch'],['🐵','khỉ'],['🐔','gà'],['🐼','gấu trúc'],['🦊','cáo']];
const aniOpt=a=>({pic:a[0],t:'con '+a[1],k:a[1]});

const M={
  count:(lo,hi)=>()=>{const [e,nm]=pick(OBJ),n=rint(lo,hi);return Q(`Có mấy ${nm}?`,n,numOpts(n,Math.max(0,lo-1),Math.min(10,hi+2)),{visual:grp(e,n),cols:4,big:true});},
  pickGroup:(lo,hi)=>()=>{const [e,nm]=pick(OBJ),n=rint(Math.max(1,lo),hi);const mk=k=>({html:grp(e,k,'sm'),k:'g'+k});return Q(`Nhóm nào có ${n} ${nm}?`,mk(n),numOpts(n,Math.max(1,lo-1),Math.min(10,hi+1)).map(mk),{n:3,cols:1});},
  readNum:(lo,hi)=>()=>{const n=rint(lo,hi);return Q(`Số nào là số "${readVN(n)}"?`,n,numOpts(n,lo,hi),{cols:4,big:true});},
  moreLess:()=>{const [e1]=pick(OBJ),[e2]=pick(OBJ);const a=rint(1,9);let b=rint(1,9);if(Math.random()<.25)b=a;const more=Math.random()<.5;
    const ans=a===b?'Bằng nhau':(more?(a>b?'Bên trái':'Bên phải'):(a<b?'Bên trái':'Bên phải'));const opts=['Bên trái','Bên phải','Bằng nhau'];
    return {type:'choice',prompt:`Bên nào ${more?'nhiều hơn':'ít hơn'}?`,visual:`<div class="pair"><div><b>Bên trái</b>${grp(e1,a,'sm')}</div><div><b>Bên phải</b>${grp(e2,b,'sm')}</div></div>`,options:opts,answer:opts.indexOf(ans),cols:3};},
  sign:(lo,hi)=>()=>{const a=rint(lo,hi);const b=Math.random()<.2?a:rint(lo,hi);const ans=a>b?'>':a<b?'<':'=';const opts=[{t:'>',sub:'lớn hơn',k:'>'},{t:'<',sub:'bé hơn',k:'<'},{t:'=',sub:'bằng',k:'='}];
    return {type:'choice',prompt:`Chọn dấu đúng: ${a} ☐ ${b}`,say:`${a} và ${b}. Chọn dấu lớn hơn, bé hơn hay bằng.`,visual:eqv(`${a}<span class="slot">?</span>${b}`),options:opts,answer:['>','<','='].indexOf(ans),cols:3,big:true};},
  extreme:(lo,hi)=>()=>{const ns=sample(range(lo,hi),4),big=Math.random()<.5,c=big?Math.max(...ns):Math.min(...ns);return Q(`Số nào ${big?'lớn nhất':'bé nhất'}?`,c,ns.filter(x=>x!==c),{cols:4,big:true});},
  split:(lo,hi)=>()=>{const n=rint(lo,hi),a=rint(1,n-1);let s='';for(let i=0;i<n;i++)s+=`<span>${i<a?'🔴':'🔵'}</span>`;return Q(`${n} gồm ${a} và mấy?`,n-a,numOpts(n-a,0,n),{visual:`<div class="grp">${s}</div>`,cols:4,big:true});},
  seq:(lo,hi)=>()=>{const st=rint(lo,hi-4),arr=range(st,st+4),mi=rint(1,3);const c=arr[mi];return Q('Số nào còn thiếu?',c,numOpts(c,Math.max(0,lo-2),hi+2),{visual:`<div class="seq">${arr.map((x,i)=>i===mi?'<span class="slot">?</span>':`<span>${x}</span>`).join('')}</div>`,cols:4,big:true});},
  orderNums:(lo,hi)=>()=>{const ns=sample(range(lo,hi),4),asc=Math.random()<.6;const it=ns.slice().sort((a,b)=>asc?a-b:b-a).map(String);return {type:'order',prompt:`Xếp các số từ ${asc?'bé đến lớn':'lớn đến bé'}`,items:it};},
  shapeName:()=>{const names=Object.keys(SH),nm=pick(names);return Q('Đây là hình gì?',{t:nm,k:nm},names.filter(x=>x!==nm).map(x=>({t:x,k:x})),{visual:shapeSvg(nm,pick(COLORS)),cols:2});},
  shapeObj:()=>{const names=Object.keys(SHOBJ),nm=pick(names),o=pick(SHOBJ[nm]);const ds=names.filter(x=>x!==nm).map(x=>pick(SHOBJ[x]));return Q(`Đồ vật nào có dạng ${nm}?`,{pic:o[0],t:o[1],k:o[1]},ds.map(d=>({pic:d[0],t:d[1],k:d[1]})),{cols:2});},
  countShapes:()=>{const names=Object.keys(SH),target=pick(names);let svg='',cnt=0;const cells=shuffle(range(0,9)),k=rint(6,10);

function hasU(w,u){return w.syl.some(s=>isCons(u)?s.init===u:s.rime===u);}
const wordsWith=u=>WB.filter(w=>hasU(w,u));
function blankWord(w,u){
  const parts=w.w.split(' ');const i=w.syl.findIndex(s=>isCons(u)?s.init===u:s.rime===u);
  const s=parts[i],p=w.syl[i];parts[i]=isCons(u)?'＿'+s.slice(p.init.length):s.slice(0,p.init.length)+'＿';
  return parts.join(' ');
}
const SAYU={b:'bờ',c:'cờ',d:'dờ',đ:'đờ',g:'gờ',h:'hờ',k:'ca',l:'lờ',m:'mờ',n:'nờ',p:'pờ',r:'rờ',s:'sờ',t:'tờ',v:'vờ',x:'xờ',ch:'chờ',kh:'khờ',gh:'gờ kép',gi:'di',nh:'nhờ',ng:'ngờ',ngh:'ngờ kép',ph:'phờ',qu:'quờ',th:'thờ',tr:'trờ',y:'i dài',i:'i ngắn'};
const sayU=u=>SAYU[u]||u;
const ALL_V=['a','ă','â','e','ê','i','o','ô','ơ','u','ư','y','ia','ua','ưa'];
const RIMES=[];
function similarUnits(u,units){
  const kindCons=isCons(u);
  const pool=[...units.filter(x=>x!==u&&isCons(x)===kindCons),...shuffle((kindCons?INITS:[...ALL_V,...RIMES]).filter(x=>x!==u&&!units.includes(x)))];
  return pool;
}
const optW=w=>({pic:w.e,t:w.w,k:w.w});
const optP=w=>({pic:w.e,k:w.e,say:w.w});
function tvGens(units,label){
  const withW=units.filter(u=>wordsWith(u).length);
  const uw=()=>WB.filter(w=>withW.some(u=>hasU(w,u)));
  const uo=x=>({t:x,k:x,say:sayU(x)});
  const g=[
    ()=>{const u=pick(units);return Q('Nghe và chọn chữ đúng',uo(u),similarUnits(u,units).map(uo),{audio:{text:sayU(u)},cols:4,big:true});},
    ()=>{const u=pick(withW),w=pick(wordsWith(u));return Q(`Hình nào có ${label} "${u}"?`,optW(w),shuffle(WB.filter(x=>!hasU(x,u))).map(optW),{cols:2,say:`Hình nào có ${label} ${sayU(u)}?`});},
    ()=>{const w=pick(uw());return Q('Con đọc chữ, rồi chọn hình đúng',optP(w),shuffle(WB.filter(x=>x.e!==w.e)).map(optP),{visual:`<div class="word">${w.w}</div>`,cols:4});},
    ()=>{const u=pick(withW),w=pick(wordsWith(u));return Q(`Chọn ${label} còn thiếu`,uo(u),similarUnits(u,units).map(uo),{visual:`<div class="pic-lg">${w.e}</div><div class="word">${blankWord(w,u)}</div>`,cols:4,big:true,say:`Chọn ${label} còn thiếu trong tiếng ${w.w}`});},
    ()=>{const w=pick(uw());return Q('Nghe và chọn hình đúng',optP(w),shuffle(WB.filter(x=>x.e!==w.e)).map(optP),{audio:{text:w.w},cols:4});}
  ];
  return withW.length?g:[g[0]];
}
function tvLearn(units,label){
  return units.map(u=>{const ex=sample(wordsWith(u),3);return {unit:u,say:`${label} ${sayU(u)}`,ex};});
}
const TONE_SETS=[['ma','mà','má','mả','mã','mạ'],['ba','bà','bá','bả','bã','bạ'],['be','bè','bé','bẻ','bẽ','bẹ'],['co','cò','có','cỏ','cõ','cọ'],['ca','cà','cá','cả','cã','cạ']];
const TONE_ORDER=['ngang','huyền','sắc','hỏi','ngã','nặng'];
const oneSyl=()=>WB.filter(w=>w.syl.length===1);
const toneGens=[
  ()=>{const w=pick(oneSyl()),t=toneOf(w.w);const o=x=>({t:TONE_SIGN[x],k:x});return Q('Tiếng này có dấu gì?',o(t),shuffle(TONE_ORDER.filter(x=>x!==t)).map(o),{visual:`<div class="pic-lg">${w.e}</div><div class="word">${w.w}</div>`,cols:2});},
  ()=>{const t=pick(TONE_ORDER.slice(1));const good=oneSyl().filter(w=>toneOf(w.w)===t),bad=oneSyl().filter(w=>toneOf(w.w)!==t);const w=pick(good);return Q(`Tiếng nào có ${TONE_SIGN[t].split(' (')[0]}?`,optW(w),shuffle(bad).map(optW),{cols:2});},
  ()=>{const set=pick(TONE_SETS),w=pick(set);return Q('Nghe và chọn tiếng đúng',{t:w,k:w},shuffle(set.filter(x=>x!==w)).map(x=>({t:x,k:x})),{audio:{text:w},cols:2,big:true});}
];

const PAIRS={c:['c','k'],k:['c','k'],g:['g','gh'],gh:['g','gh'],ng:['ng','ngh'],ngh:['ng','ngh']};
const spellGens=[
  ()=>{const [w,e,u]=pick(SPELL);const [a,b]=PAIRS[u];return Q(`Điền ${a} hay ${b}?`,{t:u,k:u,say:sayU(u)},[{t:u===a?b:a,k:u===a?b:a,say:sayU(u===a?b:a)}],{visual:`<div class="pic-lg">${e}</div><div class="word">＿${w.slice(u.length)}</div>`,n:2,cols:2,big:true});},
  ()=>{const [w,e,u]=pick(SPELL);const [a,b]=PAIRS[u];const wrong=(u===a?b:a)+w.slice(u.length);return Q('Chữ nào viết đúng?',{t:w,k:w},[{t:wrong,k:wrong}],{visual:`<div class="pic-lg">${e}</div>`,n:2,cols:2,big:true});}

  ['dd4','Em giữ trang phục gọn gàng, sạch sẽ',['Quần áo cần sạch, phẳng, vừa người và hợp thời tiết.','Không lau tay, lau mũi vào áo. Không chơi chỗ bẩn làm lấm quần áo.','Quần áo bẩn bỏ vào giỏ đồ giặt. Quần áo sạch gấp gọn cất vào tủ.'],[

 ['Yêu thương gia đình',[
  ['dd5','Gia đình của em',['Gia đình là nơi em được yêu thương, chăm sóc.','Mọi người trong gia đình quan tâm, giúp đỡ nhau.','Em thể hiện tình yêu bằng lời nói và việc làm: ôm bố mẹ, nói lời yêu thương, giúp việc nhà.'],[

function addStars(delta,text){

const LSKEY='minhan-hocvui-v1';
function saveLocal(){try{localStorage.setItem(LSKEY,JSON.stringify(S));}catch(e){}}

const Store={ref:null,mode:'local',saving:false,again:false,
  async init(){
    try{
      if(!window.claude||!window.claude.use)return;
      const db=await window.claude.use('db');if(!db)return;
      this.ref=db.doc('app/minhan');
      const snap=await this.ref.get();
      if(snap.exists){const d=snap.data();if((d.rev||0)>=(S.rev||0)){S=migrate(JSON.parse(JSON.stringify(d)));saveLocal();refresh();}else this.save();}
      else this.save();
      this.mode='cloud';refresh();
      this.ref.onSnapshot(s=>{if(!s.exists||s.metadata.hasPendingWrites)return;const d=s.data();if((d.rev||0)>(S.rev||0)){S=migrate(JSON.parse(JSON.stringify(d)));saveLocal();refresh();}},()=>{});
    }catch(e){}
  },
  commit(){S.rev=(S.rev||0)+1;saveLocal();this.save();},
  async save(){
    if(!this.ref)return;if(this.saving){this.again=true;return;}
    this.saving=true;
    try{await this.ref.set(JSON.parse(JSON.stringify(S)));this.mode='cloud';}
    catch(e){if(e&&e.code==='unavailable')setTimeout(()=>this.save(),1500);else if(e&&e.code==='invalid_argument')this.mode='local';}
    this.saving=false;if(this.again){this.again=false;this.save();}
  }
};

function speak(text,lang='vi'){
  if(!text||!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(lang==='vi'?spoken(text):text);u.lang=lang==='en'?'en-US':'vi-VN';
    const want=lang==='en'?['en-us','en-gb','en']:['vi-vn','vi'];let v=null;for(const w of want){v=VOICES.find(x=>(x.lang||'').replace('_','-').toLowerCase().startsWith(w));if(v)break;}
    if(v)u.voice=v;u.rate=lang==='en'?.8:.9;speechSynthesis.speak(u);}catch(e){}
}
let AC=null;
function chime(ok){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;(ok?[660,880,1175]:[330,247]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ok?'sine':'triangle';o.frequency.value=f;const s=t+i*.11;g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(.22,s+.02);g.gain.exponentialRampToValueAtTime(.0001,s+.28);o.connect(g).connect(AC.destination);o.start(s);o.stop(s+.3);});}catch(e){}}

  else if(l.learnSpell){cards=[['k','Viết k trước e, ê, i: kem, kéo, kính. Còn lại viết c: cá, cua, cây.'],['gh','Viết gh trước e, ê, i: ghế, ghim. Còn lại viết g: gà, gấu, gỗ.'],['ngh','Viết ngh trước e, ê, i: nghé, nghĩ. Còn lại viết ng: ngựa, ngô, ngủ.']].map(([u,t])=>`<div class="lcard"><div class="top"><span class="unit">${u}</span>${sayBtn(t)}</div><p>${t}</p></div>`).join('');}

      `<div class="lcard" style="grid-column:1/-1"><p>Mẫu câu</p>${enSentences(u).map(s=>`<div class="row"><span class="enpat">${esc(s)}</span>${sayBtn(s,'en',1)}</div>`).join('')}</div>`;}

function startQuiz(id){
  const qs=L[id].gen();
  QZ={id,qs,i:0,res:[],picked:null,sel:[],bank:null,done:false};prepQ();saveQuiz();render();speakQ();
}
function prepQ(){const q=QZ.qs[QZ.i];QZ.picked=null;QZ.sel=[];QZ.checked=null;
  if(q.type==='order'){let b=range(0,q.items.length-1);for(let k=0;k<6;k++){b=shuffle(b);if(b.some((x,i)=>q.items[x]!==q.items[i]))break;}QZ.bank=b;}}
function speakQ(){const q=QZ.qs[QZ.i];if(q.audio)speak(q.audio.text,q.audio.lang||'vi');else if(S.autoRead)speak(q.say||q.prompt,'vi');}
function optHTML(o,i,q){
  const O=typeof o==='object'?o:{t:String(o)};
  const cls=['opt'];if(q.big&&!O.pic&&!O.html)cls.push('big');if(O.pic||O.html)cls.push('col');else if(q.optLang)cls.push('left');
  if(QZ.picked!==null){if(i===q.answer)cls.push('ok');else if(i===QZ.picked)cls.push('no');}
  const hasT=O.t!==undefined&&O.t!=='';
  const speaker=(q.optLang&&hasT)?`<span class="say sm osay" role="button" tabindex="0" aria-label="Nghe" data-a="osay" data-i="${i}">${SPEAKER}</span>`:'';
  return `<button class="${cls.join(' ')}" data-a="pick" data-i="${i}">${O.html||''}${O.pic?`<span class="pic">${picHTML(O.pic)}</span>`:''}${hasT?`<span class="${O.pic||O.html?'lb':'t'}">${esc(O.t)}${O.sub?`<span class="sub">${esc(O.sub)}</span>`:''}</span>`:''}${speaker}</button>`;
}
function quizHTML(){
  const q=QZ.qs[QZ.i],n=QZ.qs.length;
  const dots=QZ.qs.map((_,i)=>`<i class="${i<QZ.res.length?(QZ.res[i]?'ok':'no'):(i===QZ.i?'cur':'')}"></i>`).join('');
  let body='';
  if(q.type==='choice'){
    const cols=q.cols||2;
    body=`<div class="opts ${cols===1?'c1':''} ${QZ.picked!==null?'lock':''}" style="--cols:${cols}">${q.options.map((o,i)=>optHTML(o,i,q)).join('')}</div>`;
  }else{
    const st=QZ.checked===null?'':(QZ.checked?'ok':'no');
    body=`<div class="order-slot ${st}" style="${q.vertical?'flex-direction:column;align-items:stretch':''}">${QZ.sel.map((bi,k)=>`<button class="tile" data-a="ord-rm" data-i="${k}" ${QZ.checked!==null?'disabled':''}>${esc(q.items[bi])}</button>`).join('')}</div>
    <div class="order-bank">${QZ.bank.map(bi=>`<button class="tile ${QZ.sel.includes(bi)?'used':''}" data-a="ord-add" data-i="${bi}" ${QZ.checked!==null?'disabled':''}>${esc(q.items[bi])}</button>`).join('')}</div>
    ${QZ.checked===null&&QZ.sel.length===q.items.length?'<div class="cta" style="margin:0"><button class="btn good" data-a="ord-check">Kiểm tra</button></div>':''}`;
  }
  let fb='';
  const answered=QZ.res.length>QZ.i;
  if(answered){const ok=QZ.res[QZ.i];const last=QZ.i===n-1;
    let right='';if(!ok){if(q.type==='choice'){const o=q.options[q.answer];const O=typeof o==='object'?o:{t:String(o)};right=O.t?`Đáp án đúng: ${esc(O.t)}`:'Đáp án đúng đã được tô xanh.';}else right=`Đúng là: ${esc(q.items.join(q.vertical?' → ':' '))}`;}
    fb=`<div class="fb ${ok?'ok':'no'}" role="status"><span>${ok?pick(['Giỏi quá!','Chính xác!','Tuyệt vời!','Đúng rồi!','Con làm tốt lắm!']):'Chưa đúng rồi. '+right}</span><button class="btn ${ok?'good':''}" data-a="next">${last?'Xem kết quả':'Câu tiếp'} ›</button></div>`;}
  return `<div class="quiz"><div class="qtop"><div class="dots" aria-label="Câu ${QZ.i+1} trên ${n}">${dots}</div><span style="font-weight:800">${QZ.i+1}/${n}</span><button class="icon-btn" data-a="quit" style="height:40px">Thoát</button></div>
  <div class="qcard"><div class="prompt"><button class="say" data-a="qsay" aria-label="Đọc câu hỏi">${SPEAKER}</button><span class="tx">${esc(q.prompt)}</span></div>
  ${q.audio?`<div class="visual"><button class="listen" data-a="listen" aria-label="Nghe lại">${SPEAKER}</button></div>`:''}
  ${q.visual?`<div class="visual">${q.visual}</div>`:''}
  ${body}</div>${fb}</div>`;
}
function saveQuiz(){S.quiz=QZ&&!QZ.done?JSON.parse(JSON.stringify(QZ)):null;Store.commit();}
function resumeQuiz(){if(QZ||!S.quiz||!L[S.quiz.id]||S.quiz.done)return false;QZ=JSON.parse(JSON.stringify(S.quiz));NAV={v:'lesson',id:QZ.id,tab:'practice'};render();window.scrollTo(0,0);toast(`Con làm tiếp bài đang dở nhé (câu ${QZ.i+1}/${QZ.qs.length})`);return true;}
function answer(ok){QZ.res[QZ.i]=ok;chime(ok);}
function nextQ(){if(QZ.i<QZ.qs.length-1){QZ.i++;prepQ();saveQuiz();render();speakQ();window.scrollTo({top:0});}else finishQuiz();}
function finishQuiz(forced){
  const l=L[QZ.id],n=QZ.qs.length;const correct=QZ.res.filter(Boolean).length;const pct=Math.round(correct/n*100);const pass=pct>=PASS;
  const r=S.lessons[l.id]||(S.lessons[l.id]={best:0,tries:0,passDay:''});
  r.tries++;r.best=Math.max(r.best,pct);r.last=pct;
  const t=todayStr();let delta=0,counted=true;
  if(r.passDay===t){counted=false;}
  else if(pass){delta=addStars(WIN,`Đạt ${pct}% · ${SUBJ_BY[l.subj].name}: ${l.title}`);r.passDay=t;}
  else{delta=addStars(-LOSE,`${forced?'Bỏ dở':'Chưa đạt'} ${pct}% · ${SUBJ_BY[l.subj].name}: ${l.title}`);}
  touchStreak();S.lastLesson=l.id;S.quiz=null;Store.commit();
  QZ.done=true;QZ.result={pct,correct,n,pass,delta,counted};
  if(!forced){render();if(pass&&counted){burst();speak('Tuyệt vời! Con được cộng ba sao!');}else if(pass)speak('Giỏi lắm!');else speak('Cố lên! Làm lại nhé!');window.scrollTo({top:0});}
}
function resultHTML(l){
  const R=QZ.result;
  let d='';if(!R.counted)d=`<div class="delta zero">Hôm nay bài này đã nhận sao rồi</div>`;else if(R.delta>0)d=`<div class="delta plus">+${R.delta} sao</div>`;else if(R.delta<0)d=`<div class="delta minus">${R.delta} sao</div>`;else d=`<div class="delta zero">Chưa có sao để trừ</div>`;
  const msg=R.pass?'Con làm rất tốt! Giờ thử làm ở ngoài đời nhé.':'Chưa đủ 80%. Con xem lại bài học rồi làm lại nhé!';
  return `<div class="result"><div class="ring" style="--p:${R.pct};--rc:${R.pass?'var(--good)':'var(--bad)'}"><div><b>${R.pct}%</b><span>${R.correct}/${R.n} câu đúng</span></div></div>${d}<h2>${msg}</h2>
  <div class="row" style="justify-content:center">${R.pass?`<button class="btn gold" data-a="tab" data-t="real">Thử thách ngoài đời ›</button>`:`<button class="btn ghost" data-a="tab" data-t="learn">Xem lại bài học</button>`}<button class="btn ${R.pass?'ghost':''}" data-a="start">Làm lại</button></div></div>`;
}

  if(wait.length||done.length){h+=`<div class="sec-title"><h2>Phiếu đi chơi của con</h2></div>`+[...wait,...done].map(v=>`<div class="voucher ${v.st==='done'?'done':''}"><span class="e">${v.pic}</span><span><b>${esc(v.name)}</b><br><span class="muted" style="font-size:15px;font-weight:700">${v.st==='done'?'Đã đi ngày '+fmtDate(v.done).split(' ')[0]:'Đổi ngày '+fmtDate(v.d).split(' ')[0]+' · Chờ bố mẹ đưa đi'}</span></span>${v.st==='wait'?`<span class="chip try">${v.cost} sao</span>`:'<span class="chip ok">✓</span>'}</div>`).join('');}
  TIERS.forEach((t,ti)=>{const rs=S.rewards.filter(r=>r.tier===ti);if(!rs.length)return;
    h+=`<section class="tier"><div class="tier-h" style="--tc:${t.c}"><span class="badge">${t.n}</span><span class="cost">${t.cost} sao</span></div><div class="rewards">${rs.map(r=>{const times=S.vouchers.filter(v=>v.rid===r.id).length;return `<div class="rw"><span class="e">${r.pic}</span><b>${esc(r.name)}</b><span class="muted" style="font-weight:800;font-size:15px">${t.cost} sao${times?` · <span style="color:var(--good)">Đã đổi ${times} lần</span>`:''}</span>${S.stars>=t.cost?`<button class="btn gold" data-a="redeem" data-id="${r.id}">${times?'Đổi lại lần nữa':'Đổi quà'}</button>`:`<span class="need">${times?'Muốn đổi lại? ':''}Còn thiếu ${t.cost-S.stars} sao</span>`}</div>`;}).join('')}</div></section>`;});
  return h;
}
function redeem(rid){
  const r=S.rewards.find(x=>x.id===rid);if(!r)return;const cost=rewardCost(r);if(S.stars<cost)return;
  S.stars-=cost;S.spent=(S.spent||0)+cost;S.history.unshift({d:new Date().toISOString(),t:`Đổi quà · ${r.name}`,s:-cost});
  S.vouchers.unshift({id:'v'+Date.now(),rid,name:r.name,pic:r.pic,cost,d:new Date().toISOString(),st:'wait'});
  Store.commit();closeModal();render();burst();toast(`Đã đổi: ${r.name}! Tích thêm ${cost} sao là đổi lại được.`);
}

  h+=`<div class="sec-title"><h2>Điều chỉnh sao</h2></div><div class="row">${[3,1,-1,-3].map(n=>`<button class="btn ${n>0?'good':'bad'}" data-a="adj" data-n="${n}">${n>0?'+':''}${n} sao</button>`).join('')}</div><p class="muted" style="font-size:15px">Dùng khi con làm việc tốt ngoài app, hoặc để sửa sai sót. Mọi thay đổi đều ghi vào lịch sử.</p>`;
  h+=`<div class="sec-title"><h2>Lịch sử sao</h2><span class="muted" style="font-weight:700">40 lần gần nhất</span></div>`+(S.history.length?`<div class="tbl-wrap"><table class="hist"><tbody>${S.history.slice(0,40).map(x=>`<tr><td class="d">${fmtDate(x.d)}</td><td>${esc(x.t)}${x.want!==undefined&&x.want!==x.s?' <span class="muted">(đang 0 sao)</span>':''}</td><td class="n ${x.s>0?'p':x.s<0?'m':''}">${x.s>0?'+':''}${x.s}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Chưa có hoạt động nào.</p>');
  h+=`<div class="sec-title"><h2>Phần thưởng</h2></div><div class="plist">${S.rewards.map(r=>`<div class="pitem"><div><b>${r.pic} ${esc(r.name)}</b><div class="muted" style="font-size:14px;font-weight:700">Mốc ${TIERS[r.tier].n} · ${rewardCost(r)} sao</div></div><button class="btn ghost" data-a="rw-del" data-id="${r.id}" aria-label="Xóa ${esc(r.name)}">Xóa</button></div>`).join('')}</div>
  <div class="card" style="margin-top:12px"><div class="form"><label>Biểu tượng<input id="rw-pic" maxlength="4" placeholder="🎡" value="🎡"></label><label>Tên phần thưởng<input id="rw-name" placeholder="Ví dụ: Đi đu quay"></label><label>Mốc sao<select id="rw-tier">${TIERS.map((t,i)=>`<option value="${i}">${t.n} · ${t.cost} sao</option>`).join('')}</select></label><button class="btn" data-a="rw-add">Thêm</button></div></div>`;
  h+=`<div class="sec-title"><h2>Sao lưu và chuyển máy</h2></div><div class="card" style="display:grid;gap:10px">
   <p class="muted" style="margin:0;font-size:15px;font-weight:700">Sao chép mã sao lưu rồi dán vào app ở máy khác (hoặc bản trên web riêng) để chuyển toàn bộ sao, điểm và phiếu đi chơi sang.</p>
   <div class="row"><button class="btn ghost" data-a="bk-copy">Sao chép mã sao lưu</button></div>
   <textarea id="bk-text" rows="3" placeholder="Dán mã sao lưu vào đây để khôi phục" style="width:100%;border:2px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:14px;background:#fff;color:var(--ink)"></textarea>
   <div class="row"><button class="btn" data-a="bk-load">Khôi phục từ mã</button></div></div>`;
  h+=`<div class="sec-title"><h2>Cài đặt</h2></div><div class="card" style="display:grid;gap:16px">
   <label class="toggle"><input type="checkbox" id="autoread" ${S.autoRead?'checked':''}> Tự đọc câu hỏi khi chuyển câu</label>
   <div class="form" style="grid-template-columns:1fr 1fr auto"><label>Mã PIN mới (4 số)<input id="pin1" inputmode="numeric" maxlength="4" pattern="[0-9]*"></label><label>Nhập lại mã PIN<input id="pin2" inputmode="numeric" maxlength="4" pattern="[0-9]*"></label><button class="btn" data-a="pin-change">Đổi mã PIN</button></div>
   ${S.pinSet?'':'<p class="muted" style="margin:0;font-size:15px">Mã PIN đang là 1234. Bố mẹ nên đổi để con không tự xác nhận.</p>'}
   <div class="danger"><b>Xóa toàn bộ tiến độ</b><span class="muted" style="font-size:15px">Xóa sao, điểm, lịch sử và phiếu. Không khôi phục được.</span><div class="row" id="reset-zone"><button class="btn ghost" data-a="reset-1">Xóa toàn bộ…</button></div></div></div>
  <div class="sec-title"><h2>Luật chơi</h2></div><div class="card"><ul style="margin:0;padding-left:20px;display:grid;gap:6px;font-weight:700">
   <li>Mỗi bài luyện tập: đúng từ 80% trở lên được +${WIN} sao; dưới 80% bị −${LOSE} sao (không trừ xuống dưới 0).</li>
   <li>Mỗi bài chỉ nhận sao 1 lần mỗi ngày. Làm lại sau khi đã đạt trong ngày thì không cộng, không trừ.</li>
   <li>Thoát giữa chừng tính là chưa đạt.</li>
   <li>Thử thách ngoài đời: bố mẹ xác nhận, làm tốt +${WIN} sao, chưa làm được −${LOSE} sao. Mỗi thử thách chỉ được cộng 1 lần.</li>
   <li>Đổi quà cần mã PIN của bố mẹ.</li></ul></div>
  <p class="save-note">${Store.mode==='cloud'?'Dữ liệu lưu trong tài khoản Claude của bố mẹ và đồng bộ giữa các máy.':'Dữ liệu đang lưu trên máy này.'}</p>`;
  return h;
}

/* ---------- modal & PIN ---------- */
function modal(html){const m=$('#modal');m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;m.hidden=false;}
function closeModal(){const m=$('#modal');m.hidden=true;m.innerHTML='';PIN=null;}
function askPin(title,cb){PIN={buf:'',cb,title};drawPin();}
function drawPin(err){
  modal(`<h2>${esc(PIN.title)}</h2><p class="muted">Bố mẹ nhập mã PIN 4 số</p><div class="pindots ${err?'err':''}">${[0,1,2,3].map(i=>`<i class="${i<PIN.buf.length?'f':''}"></i>`).join('')}</div>
  <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(k=>`<button data-a="pin-k" data-k="${k}">${k}</button>`).join('')}<button data-a="modal-close" style="font-size:17px">Hủy</button><button data-a="pin-k" data-k="0">0</button><button data-a="pin-del" style="font-size:17px">Xóa</button></div>
  ${S.pinSet?'':'<p class="hint">Mã mặc định: 1234 (đổi trong Khu bố mẹ)</p>'}`);
}
function pinKey(k){if(!PIN)return;PIN.buf+=k;if(PIN.buf.length<4){drawPin();return;}
  if(PIN.buf===S.pin){const cb=PIN.cb;closeModal();cb();}else{PIN.buf='';drawPin(true);}}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const m=$('#modal');if(e.target===m){closeModal();return;}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,ds=b.dataset;
  switch(a){
    case 'home':go({v:'home'});break;
    case 'subj':go({v:'subj',s:ds.s});break;
    case 'lesson':go({v:'lesson',id:ds.id,tab:ds.t||'learn'});break;
    case 'tab':go({v:'lesson',id:NAV.id,tab:ds.t});break;
    case 'rewards':go({v:'rewards'});break;
    case 'parent':if(NAV.v==='parent')break;askPin('Khu của bố mẹ',()=>{go({v:'parent'});PARENT=true;});break;
    case 'say':speak(ds.say,ds.lang||'vi');break;
    case 'start':startQuiz(NAV.id);break;
    case 'qsay':{const q=QZ.qs[QZ.i];speak(q.say||q.prompt,'vi');break;}
    case 'listen':{const q=QZ.qs[QZ.i];speak(q.audio.text,q.audio.lang||'vi');break;}
    case 'osay':{e.stopPropagation();const q=QZ.qs[QZ.i],o=q.options[+ds.i];const t=typeof o==='object'?o.t:String(o);speak(t,q.optLang);break;}
    case 'pick':{if(!QZ||QZ.picked!==null)return;const q=QZ.qs[QZ.i],i=+ds.i;QZ.picked=i;answer(i===q.answer);saveQuiz();
      const o=q.options[i];if(typeof o==='object'&&o.say&&!o.t)speak(o.say,o.lang||'vi');render();break;}
    case 'ord-add':{if(QZ.checked!==null)return;const i=+ds.i;if(!QZ.sel.includes(i)){QZ.sel.push(i);const q=QZ.qs[QZ.i];if(q.lang==='en')speak(q.items[i],'en');}render();break;}
    case 'ord-rm':{if(QZ.checked!==null)return;QZ.sel.splice(+ds.i,1);render();break;}
    case 'ord-check':{const q=QZ.qs[QZ.i];const ok=QZ.sel.map(i=>q.items[i]).join('|')===q.items.join('|');QZ.checked=ok;answer(ok);saveQuiz();render();break;}
    case 'next':nextQ();break;
    case 'quit':if(QZ&&QZ.res.length>0&&!QZ.done)confirmQuit(()=>go({v:'lesson',id:NAV.id,tab:'learn'}));else go({v:'lesson',id:NAV.id,tab:'learn'});break;
    case 'quit-yes':{closeModal();const then=QUIT_THEN;QUIT_THEN=null;if(QZ&&!QZ.done){while(QZ.res.length<QZ.qs.length)QZ.res.push(false);finishQuiz(true);}QZ=null;toast('Bài được tính là chưa đạt.');if(then)then();break;}
    case 'modal-close':closeModal();break;
    case 'pin-k':pinKey(ds.k);break;
    case 'pin-del':if(PIN){PIN.buf=PIN.buf.slice(0,-1);drawPin();}break;
    case 'real-later':S.challenges[ds.id]={st:'todo',d:new Date().toISOString()};Store.commit();render();toast('Đã ghi vào danh sách thử thách ở trang chính');break;
    case 'real-done':{const id=ds.id;askPin('Bố mẹ xác nhận thử thách',()=>{modal(`<h2>Minh An làm thử thách thế nào?</h2><p>${esc(L[id].real)}</p><button class="btn good" data-a="judge" data-id="${id}" data-ok="1">Con làm tốt · +${WIN} sao</button><button class="btn bad" data-a="judge" data-id="${id}" data-ok="0">Chưa làm được · −${LOSE} sao</button><button class="btn ghost" data-a="modal-close">Để bố mẹ xem lại sau</button>`);});break;}
    case 'judge':closeModal();judgeChallenge(ds.id,ds.ok==='1');render();break;
    case 'p-ok':judgeChallenge(ds.id,true);render();break;
    case 'p-no':judgeChallenge(ds.id,false);render();break;
    case 'redeem':{const r=S.rewards.find(x=>x.id===ds.id);askPin('Bố mẹ đồng ý đổi quà',()=>{modal(`<div style="font-size:64px;text-align:center">${r.pic}</div><h2>Đổi "${esc(r.name)}"?</h2><p>Dùng ${rewardCost(r)} sao. Minh An còn lại ${S.stars-rewardCost(r)} sao.</p><button class="btn gold" data-a="redeem-yes" data-id="${r.id}">Đổi quà</button><button class="btn ghost" data-a="modal-close">Để sau</button>`);});break;}
    case 'redeem-yes':redeem(ds.id);break;
    case 'v-done':{const v=S.vouchers.find(x=>x.id===ds.id);if(v){v.st='done';v.done=new Date().toISOString();Store.commit();render();toast('Đã đánh dấu: '+v.name);}break;}
    case 'adj':{const n=+ds.n;addStars(n,'Bố mẹ điều chỉnh');Store.commit();render();toast(`${n>0?'+':''}${n} sao`);break;}
    case 'rw-del':S.rewards=S.rewards.filter(r=>r.id!==ds.id);Store.commit();render();break;
    case 'rw-add':{const name=$('#rw-name').value.trim(),pic=$('#rw-pic').value.trim()||'🎁',tier=+$('#rw-tier').value;if(!name){toast('Nhập tên phần thưởng trước nhé');$('#rw-name').focus();return;}S.rewards.push({id:'c'+Date.now(),tier,name,pic});Store.commit();render();toast('Đã thêm phần thưởng');break;}
    case 'pin-change':{const a1=$('#pin1').value.trim(),a2=$('#pin2').value.trim();if(!/^\d{4}$/.test(a1)){toast('Mã PIN cần đúng 4 chữ số');return;}if(a1!==a2){toast('Hai mã PIN chưa khớp nhau');return;}S.pin=a1;S.pinSet=true;Store.commit();render();toast('Đã đổi mã PIN');break;}
    case 'reset-1':$('#reset-zone').innerHTML='<span style="font-weight:800;color:var(--bad)">Chắc chắn xóa hết?</span><button class="btn bad" data-a="reset-2">Xóa hết</button><button class="btn ghost" data-a="reset-no">Thôi</button>';break;
    case 'reset-no':render();break;
    case 'bk-copy':{const txt=JSON.stringify(S);const ta=$('#bk-text');const fallback=()=>{ta.value=txt;ta.focus();ta.select();toast('Mã đã hiện trong ô bên dưới, bấm giữ để sao chép');};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Đã sao chép mã sao lưu'),fallback);}catch(err){fallback();}break;}
    case 'bk-load':{const raw=$('#bk-text').value.trim();let d=null;try{d=JSON.parse(raw);}catch(err){}
      if(!d||typeof d!=='object'||typeof d.stars!=='number'||!d.lessons){toast('Mã sao lưu không đúng. Hãy dán lại toàn bộ mã.');return;}
      const rev=S.rev||0;S=migrate(d);S.rev=Math.max(rev,d.rev||0);Store.commit();render();toast(`Đã khôi phục: ${S.stars} sao`);break;}
    case 'reset-2':{const pin=S.pin,pinSet=S.pinSet,rev=S.rev;S=fresh();S.pin=pin;S.pinSet=pinSet;S.rev=rev;Store.commit();go({v:'home'});toast('Đã xóa toàn bộ tiến độ');break;}
  }
});
document.addEventListener('change',e=>{if(e.target.id==='autoread'){S.autoRead=e.target.checked;Store.commit();toast(S.autoRead?'Sẽ tự đọc câu hỏi':'Đã tắt tự đọc câu hỏi');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal();if(PIN&&/^\d$/.test(e.key))pinKey(e.key);if(PIN&&e.key==='Backspace'){PIN.buf=PIN.buf.slice(0,-1);drawPin();}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('osay')){e.preventDefault();e.target.click();}});

/* ---------- boot ---------- */
(function boot(){const loc=loadLocal();if(loc)S=migrate(loc);render();resumeQuiz();Store.init().then(()=>{if(NAV.v==='home')resumeQuiz();});})();
</script>
</body></html>
