<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Shopee Analyzer</title>
<style>
  :root { --bg:#fcfcfb; --card:#f3f2ef; --text:#0b0b0b; --muted:#52514e; --accent:#ee4d2d; --line:#e2e1dc; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1a1a19; --card:#262624; --text:#fff; --muted:#c3c2b7; --accent:#f05d3e; --line:#383835; } }
  * { box-sizing: border-box; }
  body { margin:0; width:340px; background:var(--bg); color:var(--text); font:13px/1.45 system-ui, sans-serif; }
  header { padding:14px 16px 10px; border-bottom:1px solid var(--line); }
  h1 { font-size:15px; margin:0; }
  .sub { color:var(--muted); font-size:12px; margin-top:2px; }
  main { padding:12px 16px 16px; display:grid; gap:10px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .tile { background:var(--card); border-radius:8px; padding:8px 10px; }
  .tile b { display:block; font-size:18px; font-variant-numeric:tabular-nums; }
  .tile span { color:var(--muted); font-size:11px; }
  button, select { width:100%; border:0; border-radius:8px; padding:9px 10px; font:600 13px system-ui; cursor:pointer; background:var(--card); color:var(--text); }
  button.primary { background:var(--accent); color:#fff; }
  .row { display:flex; gap:8px; }
  .note { color:var(--muted); font-size:11.5px; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <h1>🛍 Shopee Analyzer</h1>
  <div class="sub" id="ctx">Đang kiểm tra trang hiện tại…</div>
</header>
<main>
  <div class="grid" id="tiles"></div>
  <div id="crawlBox" class="hidden">
    <div class="row">
      <select id="pages" style="width:110px"><option value="1">1 trang</option><option value="3" selected>3 trang</option><option value="5">5 trang</option><option value="10">10 trang</option></select>
      <button id="crawl" class="primary">⬇ Quét trang này</button>
    </div>
    <button id="stop" style="margin-top:6px">Dừng quét</button>
  </div>
  <div id="productBox" class="hidden row">
    <button id="reviews" class="primary">💬 Lấy đánh giá</button>
  </div>
  <button id="open" class="primary">📊 Mở Dashboard</button>
  <div class="row">
    <button id="watchBtn">⭐ Theo dõi</button>
    <button id="profit">🧮 Tính lãi</button>
  </div>
  <div class="note">Mở trang tìm kiếm, danh mục, shop hoặc sản phẩm trên shopee.vn. Tiện ích tự ghi số liệu khi trang tải và gắn nhãn doanh thu lên từng sản phẩm.</div>
</main>
<script src="src/common.js"></script>
<script src="popup.js"></script>
</body>
</html>
