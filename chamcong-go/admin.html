<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F2572B">
<title>ChấmCông Go · Quản trị</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/lucide-static@0.460.0/font/lucide.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="admin.css">
</head>
<body>
<div id="admin"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="config.js"></script>
<script>
  // Nạp Firebase (chỉ khi đã cấu hình trong config.js) rồi tới mã của app, giữ đúng thứ tự.
  (function () {
    var list = ['core.js', 'data.js', 'admin.js'];
    if (window.CCG_CONFIG && window.CCG_CONFIG.firebase) {
      list = ['app', 'auth', 'firestore'].map(function (m) {
        return 'https://www.gstatic.com/firebasejs/10.12.2/firebase-' + m + '-compat.js';
      }).concat(list);
    }
    list.forEach(function (src) {
      var s = document.createElement('script');
      s.src = src; s.async = false;
      document.body.appendChild(s);
    });
  })();
</script>
</body>
</html>
