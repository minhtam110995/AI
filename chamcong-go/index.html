<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2572B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ChấmCông Go">
<title>ChấmCông Go</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/lucide-static@0.460.0/font/lucide.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css?v=2026-10-10c">
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>window.CCG_BUILD = '2026-10-10c';</script>
<script src="config.js?v=2026-10-10c"></script>
<script>
  // Nạp Firebase (chỉ khi đã cấu hình trong config.js) rồi tới mã của app, giữ đúng thứ tự.
  (function () {
    var list = ['core.js', 'data.js', 'app.js'];
    if (window.CCG_CONFIG && window.CCG_CONFIG.firebase) {
      list = ['app', 'auth', 'firestore'].map(function (m) {
        return 'https://www.gstatic.com/firebasejs/10.12.2/firebase-' + m + '-compat.js';
      }).concat(list);
    }
    list.forEach(function (src) {
      var s = document.createElement('script');
      // ?v= đổi mỗi lần cập nhật để trình duyệt không dùng bản cũ trong bộ nhớ tạm
      s.src = /^https?:/.test(src) ? src : src + '?v=' + window.CCG_BUILD; s.async = false;
      document.body.appendChild(s);
    });
  })();
</script>
</body>
</html>
